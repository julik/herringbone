name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]
        include:
          - os: macos-latest
            ruby: "3.4"
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  # Without the optional zstd-ruby / brotli gems: ZSTD and Brotli must fail with MissingCodecError
  # while everything else keeps working
  without-codec-gems:
    name: Without zstd/brotli gems
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: codecs
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check the codec gems are not in the bundle
        run: bundle exec ruby -e 'abort "codec gems present" if %w[zstd-ruby brotli].any? { |g| Gem.loaded_specs.key?(g) }'
      - run: bundle exec rake test

  # Same suite on the String-based Snappy path used where IO::Buffer is unavailable
  no-io-buffer:
    name: Without IO::Buffer
    runs-on: ubuntu-latest
    env:
      HERRINGBONE_NO_IO_BUFFER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test

  # Files we write are read back with pyarrow and compared, including random nested schemas
  interop:
    name: pyarrow interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pyarrow numpy datafusion
      - run: HERRINGBONE_PYTHON="$(which python)" HERRINGBONE_REQUIRE_INTEROP=1 bundle exec rake test

  gem:
    name: Build gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake build
      - name: Show packaged files
        run: tar -xOf pkg/*.gem data.tar.gz | tar -tzv
