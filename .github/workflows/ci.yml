name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Standard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake standard

  # Oldest supported Ruby, with the optional native Snappy gem (the runners have cmake to build
  # it); the pure-Ruby Snappy is covered by the "Without IO::Buffer" and "Without ... gems" jobs
  oldest-ruby:
    name: Ruby 3.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_WITH: snappy
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler-cache: true
      - name: Check the native Snappy gem is in use
        run: bundle exec ruby -Ilib -e 'require "herringbone"; abort "pure-Ruby Snappy in use" unless Herringbone::Codecs::Snappy.backend == :native'
      - run: bundle exec rake test

  # Newest Ruby, also reading the files we write back with pyarrow (including random nested
  # schemas) and building the gem
  newest-ruby:
    name: Ruby 4.0 + pyarrow interop + gem build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_WITH: snappy
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pyarrow numpy datafusion
      - name: Check the native Snappy gem is in use
        run: bundle exec ruby -Ilib -e 'require "herringbone"; abort "pure-Ruby Snappy in use" unless Herringbone::Codecs::Snappy.backend == :native'
      - run: HERRINGBONE_PYTHON="$(which python)" HERRINGBONE_REQUIRE_INTEROP=1 bundle exec rake test
      - run: bundle exec rake build
      - name: Show packaged files
        run: tar -xOf pkg/*.gem data.tar.gz | tar -tzv

  # Without the optional zstd-ruby / brotli / xxhash / numo-narray-alt gems: ZSTD and Brotli must
  # fail with MissingCodecError, bloom filters use the pure-Ruby XXH64, as: :numo raises
  # UnsupportedError (its tests skip), and everything else keeps working
  without-codec-gems:
    name: Without zstd/brotli/xxhash/numo gems
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_WITHOUT: codecs:speedups:numo
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check the optional gems are not in the bundle
        run: bundle exec ruby -e 'abort "optional gems present" if %w[zstd-ruby brotli xxhash numo-narray-alt].any? { |g| Gem.loaded_specs.key?(g) }'
      - run: bundle exec rake test

  # Same suite on the pure-Ruby Snappy's String-based path (used where IO::Buffer is unavailable);
  # the native snappy gem is not installed here
  no-io-buffer:
    name: Without IO::Buffer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HERRINGBONE_NO_IO_BUFFER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test
